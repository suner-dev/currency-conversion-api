# ========================
# Exchange rate provider (open.er-api.com - gratuit, sans cle requise)
# Surcharge possible via variables d'environnement.
# ========================
exchange-rate.base-url=${EXCHANGE_RATE_BASE_URL:https://open.er-api.com/v6}
exchange-rate.api-key=${EXCHANGE_RATE_API_KEY:}
exchange-rate.timeout=${EXCHANGE_RATE_TIMEOUT:5000}
exchange-rate.connect-timeout=${EXCHANGE_RATE_CONNECT_TIMEOUT:2000}

# ========================
# Swagger / OpenAPI
# ========================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# ========================
# Server
# ========================
server.port=${SERVER_PORT:8080}